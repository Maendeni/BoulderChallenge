<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Boulder-Challenge</title>
  <link rel="stylesheet" href="styles.css?v=20260905" />
</head>
<body>
  <header class="container header">
    <div class="headerTop">
      <h1 id="seasonTitle">Boulder-Challenge</h1>
      <span class="archiveBadge" id="archiveBadge" hidden>Archiv</span>
      <select class="seasonSelect" id="seasonSelect" aria-label="Saison wählen" hidden></select>
    </div>
    <p class="muted" id="seasonMeta">Stand: –</p>
    <div class="seasonBar" aria-hidden="true"><div id="seasonBarFill"></div></div>
    <div class="statStrip" id="statStrip"></div>
  </header>

  <nav class="container tabBar" role="tablist" aria-label="Ansicht">
    <button class="tab active" data-tab="leaderboard" role="tab" aria-selected="true">Rangliste</button>
    <button class="tab" data-tab="challenges" role="tab" aria-selected="false">Challenges</button>
    <button class="tab" data-tab="admin" role="tab" aria-selected="false">Admin</button>
  </nav>

  <main class="container">
    <section class="tabPanel" id="tab-leaderboard" role="tabpanel" aria-label="Rangliste">
      <div id="leaderboard"></div>
    </section>

    <section class="tabPanel" id="tab-challenges" role="tabpanel" aria-label="Challenges" hidden>
      <div id="challenges"></div>
    </section>

    <section class="tabPanel" id="tab-admin" role="tabpanel" aria-label="Admin" hidden>
      <p class="adminNote" id="admArchivedNote" hidden></p>
      <p class="muted">Änderungen werden als JSON kopiert und in GitHub in <code>data.json</code> eingefügt.</p>

      <div class="adminGrid">
        <label class="field">
          <span>Datum</span>
          <input id="admDate" type="date" />
        </label>

        <label class="field">
          <span>Label</span>
          <input id="admLabel" type="text" placeholder="z.B. KW 07" />
        </label>

        <label class="field fieldWide">
          <span>Route</span>
          <input id="admRoute" type="text" placeholder="z.B. Schwarz 6c – Dach rechts" />
        </label>

        <label class="field">
          <span>Schwierigkeit</span>
          <select id="admGrade">
            <option value="">– keine Angabe</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
        </label>

        <label class="field">
          <span>Definiert von</span>
          <select id="admSetBy"></select>
        </label>

        <label class="field">
          <span>Route entfernt ab (optional)</span>
          <input id="admRemovedFrom" type="date" />
        </label>

        <label class="field fieldWide">
          <span>Notiz (optional)</span>
          <input id="admNotes" type="text" placeholder="z.B. Wird nächste Woche neu geschraubt" />
        </label>
      </div>

      <div class="adminBlock">
        <div class="adminBlockTitle">Ergebnisse (Tippen zum Umschalten)</div>
        <div id="admResults" class="adminResults"></div>
      </div>

      <div class="adminActions">
        <button id="admAdd" class="btnPrimary" type="button">Challenge hinzufügen</button>
        <button id="admCopy" class="btn" type="button">JSON kopieren</button>
        <button id="admDownload" class="btn" type="button">JSON herunterladen</button>
        <button id="admResetLocal" class="btn" type="button">Lokale Änderungen verwerfen</button>
      </div>

      <div class="adminBlock">
        <div class="adminBlockTitle">Vorschau (data.json)</div>
        <textarea id="admJson" class="adminTextarea" rows="10" spellcheck="false"></textarea>
        <p class="muted">Tipp: Alles im Textfeld kopieren → GitHub <code>data.json</code> ersetzen → Commit.</p>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <p class="muted">Privater Wettbewerb · Daten aus <code>data.json</code></p>
  </footer>

  <!-- Undo-Toast -->
  <div id="toast" class="toast" hidden>
    <span id="toastMsg">Status geändert</span>
    <button id="toastUndo" type="button">Rückgängig</button>
  </div>

  <script src="app.js?v=20260905" defer></script>
</body>
</html>
